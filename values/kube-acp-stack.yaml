cockroachdb:
  enabled: true
  single-node: true
  statefulset:
    replicas: 1
acp:
  enabled: true
  serverURL: "https://acp.acp-system:8443"
  ingress:
    enabled: true
    hosts:
      - host: acp.acp-system
        paths:
          - path: /
            pathType: ImplementationSpecific
  features:
    integration_endpoints: true
    swagger_ui: true
