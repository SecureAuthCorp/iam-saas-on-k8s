name: test

on:
  push:
    branches-ignore:
      - "master"
    tags-ignore:
      - "*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
      - name: Setup Kubernetes
        uses: engineerd/setup-kind@aa272fe2a7309878ffc2a81c56cfe3ef108ae7d0 # v0.5.0
        with:
          version: "v0.16.0"
          image: "kindest/node:v1.24.6@sha256:97e8d00bc37a7598a0b32d1fabd155a96355c49fa0d4d4790aab0f161bf31be1"
      - uses: azure/setup-helm@18bc76811624f360dbd7f18c2d4ecb32c7b87bab # v1
        with:
          version: 3.14.4
        id: install
      - name: Login to docker.secureauth.com
        run: echo "${{ secrets.DOCKER_PWD }}" | docker login docker.secureauth.com -u "${{ secrets.DOCKER_USER }}" --password-stdin
      - name: Deploy
        env: # Or as an environment variable
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PWD: ${{ secrets.DOCKER_PWD }}
        run: make all
      - name: Test
        run: make test-prepare test-web-smoke
      - name: Test-clean
        run: make test-clean
      - name: Debug
        if: failure()
        run: make debug
